<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flune Skill Exchange — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* 1. Base Setup & Animated Background */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      /* Deep Academic Gradient */
      background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d, #0f9b0f);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Shapes */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
    }
    .shape-1 { top: -50px; left: -50px; width: 300px; height: 300px; background: #ff4d4d; }
    .shape-2 { bottom: -50px; right: -50px; width: 350px; height: 350px; background: #4d79ff; }

    /* --- NEW: Top Left Logo Section --- */
    .top-brand {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }

      .top-brand img {
        height: 56px; /* Adjust size of top-left logo */
      width: auto;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .top-brand span {
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
    }

    /* 2. Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 45px 35px;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .card:hover { transform: translateY(-5px); }

    /* --- NEW: Center Logo (Replacing the Star) --- */
    .center-logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto; /* Centers it */
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 2px solid #f0f2f5;
      overflow: hidden;
    }

      .center-logo-container img {
        width: 70%; /* Adjusts logo size inside the circle */
      height: 70%;
      object-fit: contain;
    }

    /* Typography */
    h2 {
      margin: 0 0 10px 0;
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #1a2a6c;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* Button */
    button {
      margin-top: 10px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: #ffffff;
      color: #333;
      font-weight: 600;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    button:hover {
      background: #f8f9fa;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      transform: translateY(-2px);
      border-color: #d0d0d0;
    }

    .google-icon { width: 20px; height: 20px; }

    .note {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    /* Mobile Responsive */
    @media (max-width: 480px) {
        .top-brand { top: 20px; left: 20px; }
        .top-brand img { height: 30px; }
        .top-brand span { font-size: 20px; }
    }
  </style>
</head>

<body>

  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="top-brand">
    <img src="flunelogo.png" alt="Flune Icon">
    <span>FluneSkills</span>
  </div>

  <div class="card">
    
    <div class="center-logo-container">
      <img src="logo.png" alt="Main Logo">
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to continue your<br>learning journey.</p>

    <button id="googleBtn">
      <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <div class="note">
      <span class="secure-icon">🔒</span> Secure login powered by Google
    </div>
  </div>

  <script type="module">
    import { googleLogin } from "./js/auth.js";
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // redirect signed-in users straight to the dashboard
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("dashboard.html");
      }
    });

    document.getElementById("googleBtn").addEventListener("click", googleLogin);
  </script>

</body>
</html>
