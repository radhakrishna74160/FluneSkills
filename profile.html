<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flune | Edit Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #ec4899;
      --glass: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(255, 255, 255, 0.5);
      --text-main: #1e293b;
      --text-light: #64748b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      /* Super Gradient Background */
      background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    /* Floating Back Button */
    .back-nav {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 10;
    }
    
    .back-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      background: white;
      color: var(--primary);
      transform: scale(1.1);
    }

    /* --- The Main Glass Card --- */
    .card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 460px;
      padding: 40px;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
      color: var(--primary);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 15px;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5), 0 8px 20px rgba(99, 102, 241, 0.2);
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    h2 {
      margin: 0;
      font-size: 26px;
      color: var(--text-main);
      font-weight: 700;
    }

    p.subtitle {
      margin: 5px 0 0;
      color: var(--text-light);
      font-size: 15px;
    }

    /* --- Form Styling --- */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-light);
      margin-bottom: 8px;
      margin-left: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      font-size: 20px;
      color: #94a3b8;
      transition: color 0.3s;
    }

    input {
      width: 100%;
      padding: 16px 16px 16px 48px; /* space for icon */
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box; /* Fixes width issues */
    }

    /* Focus State */
    input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
    }

    input:focus + i, .input-wrapper:focus-within i {
      color: var(--primary);
    }

    /* Save Button */
    button#saveBtn {
      margin-top: 10px;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Outfit', sans-serif;
    }

    button#saveBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    button#saveBtn:active {
      transform: scale(0.98);
    }

    /* Message Toast */
    .note {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
      color: var(--text-light);
    }
    
    .note.success { color: #10b981; }
    .note.error { color: #ef4444; }

  </style>
</head>

<body>

  <div class="back-nav">
    <button id="backBtn" class="back-btn" title="Back to Dashboard">
      <i class='bx bx-left-arrow-alt'></i>
    </button>
  </div>

  <div class="card">
    <div class="header">
      <div class="avatar-circle">
        <i class='bx bxs-user'></i>
      </div>
      <h2>Your Profile</h2>
      <p class="subtitle">Tell others who you are and what you do.</p>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrapper">
        <i class='bx bx-user'></i>
        <input id="name" placeholder="John Doe">
      </div>
    </div>

    <div class="form-group">
      <label>Skill You Offer</label>
      <div class="input-wrapper">
        <i class='bx bxs-book-heart'></i>
        <input id="offer" placeholder="e.g. Graphic Design">
      </div>
    </div>

    <div class="form-group">
      <label>Skill You Want</label>
      <div class="input-wrapper">
        <i class='bx bxs-graduation'></i>
        <input id="want" placeholder="e.g. Python Programming">
      </div>
    </div>

    <div class="form-group">
      <label>Phone Number (Private)</label>
      <div class="input-wrapper">
        <i class='bx bx-phone'></i>
        <input id="phone" placeholder="+1 234 567 890" inputmode="tel">
      </div>
    </div>

    <button id="saveBtn">
      Save Changes <i class='bx bx-check-circle'></i>
    </button>

    <div class="note" id="msg"></div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const db = getFirestore();

    const nameEl  = document.getElementById("name");
    const offerEl = document.getElementById("offer");
    const wantEl  = document.getElementById("want");
    const phoneEl = document.getElementById("phone");
    const msgEl   = document.getElementById("msg");
    const saveBtn = document.getElementById("saveBtn");

    let currentUser = null;

    // 🔒 Protect profile page + load existing data
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("index.html");
        return;
      }

      currentUser = user;

      try {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          const data = snap.data();
          nameEl.value  = data.name  || "";
          offerEl.value = data.offer || "";
          wantEl.value  = data.want  || "";
          phoneEl.value = data.phone || "";
        }
      } catch (err) {
        console.error("Failed to load profile:", err);
      }
    });

    // 💾 Save / Update profile
    saveBtn.addEventListener("click", async () => {
      if (!currentUser) return;

      const name  = nameEl.value.trim();
      const offer = offerEl.value.trim();
      const want  = wantEl.value.trim();
      const phone = phoneEl.value.trim();

      if (!name || !offer || !want || !phone) {
        msgEl.textContent = "Please fill all fields.";
        msgEl.className = "note error";
        return;
      }

      // UX: Loading state
      const originalText = saveBtn.innerHTML;
      saveBtn.innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Saving...";
      saveBtn.disabled = true;

      try {
        await setDoc(
          doc(db, "users", currentUser.uid),
          {
            name,
            offer,
            want,
            phone,
            email: currentUser.email,
            updatedAt: serverTimestamp()
          },
          { merge: true }
        );

        msgEl.textContent = "Profile saved successfully ✅";
        msgEl.className = "note success";
        saveBtn.innerHTML = "<i class='bx bx-check-double'></i> Saved!";
        saveBtn.style.background = "#10b981"; // Green

        setTimeout(() => {
          window.location.replace("dashboard.html");
        }, 800);

      } catch (err) {
        console.error("Save failed:", err);
        msgEl.textContent = "Failed to save profile.";
        msgEl.className = "note error";
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
      }
    });

    // Back button
    document.getElementById("backBtn").onclick = () => {
      window.location.replace("dashboard.html");
    };
  </script>

</body>
</html>
